<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewards World™ | Total rewards and pay governance</title>
<meta name="description" content="Rewards World™ helps HR, finance and boards in India design, run and explain pay. Eight connected services, from a free first look to board-ready packs.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0b1530;--navy2:#13224a;--gold:#e5a50a;--gold2:#f3c24f;--ink:#1d2333;--muted:#5b6478;--line:#e4e7ee;--bg:#f7f6f2}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.6}
a{color:inherit}h1,h2{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em;color:var(--navy)}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,4vw,48px);background:rgba(247,246,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--navy)}.logo img{border-radius:9px}
.top nav{display:flex;align-items:center;gap:18px;font-size:15px}.top nav a{text-decoration:none}.top nav a:not(.pill){color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:12px 22px;font-weight:600;text-decoration:none;font-size:16px;text-align:center}
.pill.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--navy);box-shadow:0 6px 18px rgba(229,165,10,.35)}
.pill.light{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35)}
.pill.ghost{border:1px solid var(--navy);color:var(--navy);padding:8px 16px;font-size:15px}
.hero{margin:20px clamp(12px,3vw,40px) 0;border-radius:28px;background:radial-gradient(1200px 400px at 90% -10%,#26407a 0,transparent 60%),var(--navy);color:#fff;padding:clamp(40px,8vw,96px) clamp(22px,6vw,80px)}
.hero h1{color:#fff;font-size:clamp(34px,6vw,60px);line-height:1.08;margin:.2em 0;max-width:15em}
.eyebrow{color:var(--gold2);font-weight:600;letter-spacing:.06em;margin:0}
.lead{font-size:clamp(17px,2.2vw,20px);color:#d6dcea;max-width:40em}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.wrap{max-width:1120px;margin:0 auto;padding:clamp(40px,7vw,80px) clamp(18px,4vw,32px) 0}
h2{font-size:clamp(28px,4vw,40px);margin:0 0 8px}.sub{color:var(--muted);max-width:44em;margin:0 0 24px}
ul,ol{list-style:none;margin:0;padding:0}
.grid3{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.probs li,.svc,.how li{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 1px 2px rgba(11,21,48,.04),0 8px 24px rgba(11,21,48,.05)}
.probs h3,.svc h3,.how h3{margin:0 0 6px;font-size:18px;color:var(--navy)}.probs p,.svc p,.how p{margin:0;color:var(--muted)}
.journey{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));counter-reset:s}
.svc{display:flex;flex-direction:column;gap:8px}.svc-top{display:flex;justify-content:space-between;align-items:center}
.num{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;background:#eef1f7;color:var(--navy);font-weight:700;flex-shrink:0}
.tag{font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;background:#f2f4f8;color:var(--muted)}.tag.free{background:#e7f6ec;color:#17643a}
.svc-links{margin-top:auto;padding-top:10px;display:flex;flex-wrap:wrap;gap:14px;font-size:15px}.svc-links a{color:var(--navy2)}.svc-links a.strong{font-weight:700}
.how{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.how li{display:flex;gap:14px}
.contact{text-align:center}.contact .sub{margin:0 auto 24px}.mail{color:var(--muted);margin-top:12px}
footer{margin-top:80px;background:var(--navy);color:#aeb7cc;font-size:14px}footer .wrap{padding-bottom:40px}
.legal{display:flex;flex-wrap:wrap;gap:8px 22px;margin-bottom:12px}.legal a{color:#fff}.legal small{color:#aeb7cc}
@media(max-width:560px){.top nav a:not(.pill){display:none}.cta .pill{flex:1 1 100%}}
</style>
</head>
<body>
<div id="app"><!--APP--></div>
<noscript><p style="padding:16px">Email us: totalrewardsworld@gmail.com</p></noscript>
<script src="site.js"></script>
</body>
</html>
