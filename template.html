<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewards World™ | Pay you can cost, explain and defend</title>
<meta name="description" content="Rewards World™ is a focused total rewards firm for Indian boards, CHROs, CFOs and founders, with a working tool behind every piece of work. Design it. Cost it. Govern it.">
<meta name="theme-color" content="#0C1428">
<link rel="icon" href="logo.png">
<link rel="preload" href="fonts/Newsreader-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/SourceSans3-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.className+=" js"</script>
<style>
@font-face{font-family:"Newsreader";font-style:italic;font-weight:400 500;font-display:swap;src:url(fonts/Newsreader-italic-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:"Newsreader";font-style:italic;font-weight:400 500;font-display:swap;src:url(fonts/Newsreader-italic-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/Newsreader-normal-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/Newsreader-normal-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:"Source Sans 3";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/SourceSans3-normal-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:"Source Sans 3";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/SourceSans3-normal-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{
  --paper:#F5F0E6; --paper2:#ECE5D8; --card:#FFFCF6; --ink:#1B1E24; --muted:#3F4654; --line:#D9D1C3;
  --navy:#0C1428; --navy2:#142040; --navy3:#1D2D52; --gold:#7A5E10; --gold2:#E8C35A; --cream:#F5F0E6;
  --free-bg:#E1F0E6; --free-ink:#145C32; --focus:#8A6A14;
  --serif:Newsreader,Georgia,"Times New Roman",serif; --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px; --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:18px;line-height:1.65;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;overflow-x:hidden}
section[id],[id^="svc-"]{scroll-margin-top:84px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.015em;color:var(--navy);line-height:1.14;margin:0}
h1,h2{text-wrap:balance}
p{margin:0}
a{color:inherit}
img{display:block;max-width:100%}
ul,ol{list-style:none;margin:0;padding:0}
blockquote{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.dark :focus-visible,.contact :focus-visible{outline-color:var(--gold2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:0;transform:translateY(-200%);z-index:60;background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none}
.skip:focus{transform:translateY(12px)}
.wrap{max-width:1180px;margin:0 auto;padding:0 clamp(20px,4.4vw,40px)}
.arr{display:inline-block;vertical-align:-2px;margin-left:2px;transition:transform .25s var(--ease)}
a:hover>.arr,a:focus-visible>.arr,.pill:hover .arr{transform:translateX(3px)}

/* header */
.bar{height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold))}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;padding:12px clamp(16px,4vw,48px);background:rgba(245,240,230,.92);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:700;font-size:12px;letter-spacing:.17em;color:var(--navy);flex-shrink:0}
.logo img{border-radius:9px}
#site-menu{display:flex;align-items:center;gap:2px 26px;margin-left:auto}
#site-menu a{text-decoration:none;font-size:16px;color:var(--muted);padding:8px 0;position:relative;transition:color .2s}
#site-menu a::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:1.5px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
#site-menu a:hover{color:var(--navy)}
#site-menu a:hover::after{transform:scaleX(1)}
.signin-m{display:none}
.top-actions{display:flex;align-items:center;gap:18px}
.signin-d{text-decoration:none;font-weight:600;font-size:16px;color:var(--navy);padding:8px 2px}
.signin-d:hover{text-decoration:underline;text-underline-offset:4px}
.menu-toggle{display:none;appearance:none;background:none;border:1px solid var(--navy);color:var(--navy);border-radius:999px;padding:0 16px;min-height:44px;font:600 15px/1 var(--sans);cursor:pointer}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:13px 26px;font-weight:600;text-decoration:none;font-size:17px;text-align:center;border:1px solid transparent;min-height:48px;transition:transform .25s var(--ease),box-shadow .25s,background .25s,filter .25s}
.pill.sm{padding:9px 20px;min-height:44px;font-size:16px}
.pill.gold{background:linear-gradient(180deg,#F2D77F,var(--gold2));color:var(--navy);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 8px 22px rgba(184,144,46,.28)}
.pill.gold:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.55) inset,0 12px 28px rgba(184,144,46,.36)}
.pill.ghost{border-color:var(--navy);color:var(--navy);background:transparent}
.pill.ghost:hover{background:var(--navy);color:var(--cream)}

/* section scaffolding */
.block{padding:clamp(72px,10vw,136px) 0 0}
.block.dark{background:var(--navy);margin-top:clamp(72px,10vw,136px);padding:clamp(64px,9vw,120px) 0;color:var(--cream)}
.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.11em;text-transform:uppercase;font-size:13px;display:flex;align-items:center;gap:12px}
.secnum{font-family:var(--serif);font-size:15px;letter-spacing:.04em;color:var(--navy);border:1px solid var(--navy);border-radius:999px;padding:1px 9px 0;line-height:1.5}
.dark .eyebrow,.contact .eyebrow{color:var(--gold2)}
.dark .secnum,.contact .secnum{color:var(--gold2);border-color:var(--gold2)}
.sec-head{max-width:46rem;margin-bottom:clamp(36px,5vw,64px)}
.sec-head h2{font-size:clamp(30px,4.4vw,48px);margin:16px 0 0}
.sub{color:var(--muted);font-size:clamp(17px,1.5vw,19px);margin-top:18px;max-width:38em}
.dark h2,.dark h3,.contact h2{color:var(--cream)}
.dark .sub,.contact .sub{color:#CBD2E2}
.more{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:16px;color:var(--navy);text-decoration:underline;text-decoration-color:rgba(122,94,16,.45);text-underline-offset:5px;text-decoration-thickness:1.5px}
.more:hover{text-decoration-color:var(--gold)}
.kick{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}

/* motion */
.js .rv{opacity:0;transform:translateY(16px);transition:opacity .8s var(--ease) var(--d,0ms),transform .8s var(--ease) var(--d,0ms)}
.js .rv.in{opacity:1;transform:none}
.js .hi{opacity:0;transform:translateY(14px);animation:rise .9s var(--ease) var(--d,0ms) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* 1 hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:clamp(32px,6vw,88px);align-items:center;padding-top:clamp(48px,8vw,112px);padding-bottom:0}
.hero h1{font-size:clamp(42px,7.4vw,84px);letter-spacing:-.025em;line-height:1.04;margin:20px 0 26px;max-width:11em}
.lead{font-size:clamp(18px,1.9vw,21px);color:var(--muted);max-width:35em}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:34px}
.questions{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(26px,3vw,38px);box-shadow:0 30px 70px -30px rgba(12,20,40,.28);position:relative}
.questions::before{content:"";position:absolute;left:clamp(26px,3vw,38px);top:0;width:56px;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:0 0 3px 3px}
.qt{font-size:15px;font-family:var(--sans);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.questions ol li{display:flex;gap:16px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:clamp(20px,2.1vw,24px);line-height:1.25;color:var(--navy)}
.qn{font-size:15px;font-family:var(--sans);font-weight:700;color:var(--gold);min-width:1.1em}
.qnote{color:var(--muted);font-size:16px;margin:18px 0 18px}
.tests{display:flex;flex-wrap:wrap;gap:8px}
.tests li{font-size:14px;font-weight:600;color:var(--navy);background:var(--paper2);border-radius:999px;padding:5px 14px}
.tagline{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--navy);margin-top:20px}

/* 2 journey */
.journey-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(36px,6vw,96px);align-items:start}
.journey-intro{position:sticky;top:110px}
.journey-intro .sec-head{margin-bottom:28px}
.price-note{color:var(--muted);font-size:16px;margin:0 0 22px;max-width:28em}
.steps{position:relative}
.step{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr);gap:0 20px;padding-bottom:36px}
.step::before{content:"";position:absolute;left:25px;top:52px;bottom:-4px;width:2px;background:linear-gradient(var(--gold2),var(--line));transform:scaleY(0);transform-origin:top;transition:transform 1s var(--ease) .2s}
.js .step.in::before,.step.in::before{transform:scaleY(1)}
.step.last::before{display:none}
.step.last{padding-bottom:0}
.node{width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--gold2);display:grid;place-items:center;font-family:var(--serif);font-size:22px;box-shadow:0 0 0 6px var(--paper)}
.step-body{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px 22px;transition:border-color .3s,box-shadow .3s,transform .3s var(--ease)}
.step-body:hover{border-color:#C9BDA4;box-shadow:0 18px 40px -26px rgba(12,20,40,.35);transform:translateY(-2px)}
.step-main h3{font-size:clamp(23px,2.4vw,28px)}
.step-main p{color:var(--muted);margin-top:6px;font-size:17.5px}
.step-side{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:14px}
.tag{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:3px 12px;letter-spacing:.02em}
.tag.free{background:var(--free-bg);color:var(--free-ink)}
.tag.soft{background:var(--paper2);color:var(--navy)}
.feeds{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted);line-height:1.4}
.feeds .fl{font-family:var(--sans);font-style:normal;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:2px}

/* 3 who */
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(16px,2.2vw,28px)}
.people article{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:clamp(26px,3vw,40px);display:flex;flex-direction:column;gap:18px}
.people h3{font-size:clamp(26px,2.8vw,34px);display:flex;align-items:center;gap:12px}
.people h3::after{content:"";height:1px;flex:1;background:var(--line)}
.people blockquote p{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2vw,23px);line-height:1.38;color:var(--navy)}
.people blockquote p::before{content:"“"}
.people blockquote p::after{content:"”"}
.gives{color:var(--muted);font-size:17px}
.people .more{margin-top:auto}
.entities{margin-top:clamp(36px,5vw,56px);display:grid;grid-template-columns:auto 1fr;gap:16px 40px;align-items:start;padding:clamp(24px,3vw,36px) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.entities h3{font-size:clamp(22px,2.2vw,26px);grid-row:span 2}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips li{background:var(--navy);color:var(--cream);border-radius:999px;padding:6px 18px;font-weight:600;font-size:16px}
.entities p{color:var(--muted);font-size:16px;max-width:42em}

/* 4 samples */
.sheets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,28px);align-items:stretch}
.sheet{position:relative;margin:0;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-radius:14px;padding:26px 24px 22px;overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.6)}
.sheet::after{content:attr(data-mark);position:absolute;inset:0;display:grid;place-items:center;font-family:var(--sans);font-weight:700;font-size:clamp(54px,6vw,76px);letter-spacing:.12em;color:rgba(12,20,40,.045);transform:rotate(-24deg);pointer-events:none;user-select:none}
.badge{position:absolute;top:16px;right:16px;background:var(--navy);color:var(--gold2);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:4px 11px;border-radius:999px}
.sheet figcaption{display:flex;flex-direction:column;gap:2px;margin-bottom:16px;padding-right:96px}
.sheet figcaption b{font-family:var(--serif);font-weight:500;font-size:25px;color:var(--navy);line-height:1.15;margin-top:4px}
.subt{font-size:14.5px;color:var(--muted)}
.sheet .foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted);line-height:1.5}
.sheet .qa,.sheet .tscroll,.sheet .checks{margin-bottom:16px}
.qa>div{padding:11px 0;border-top:1px solid var(--line)}
.qa dt{font-size:14px;color:var(--muted)}
.qa dd{margin:2px 0 0;display:flex;flex-direction:column}
.qa dd strong{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--navy)}
.qa dd span{font-size:14.5px;color:var(--muted)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:15.5px;font-variant-numeric:tabular-nums}
th,td{padding:10px 6px;text-align:left;border-top:1px solid var(--line)}
thead th{border-top:0;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:2px}
tbody th{font-weight:700;color:var(--navy)}
.num{text-align:right}
td.num,th.num{white-space:nowrap}
tbody tr:nth-child(3){background:rgba(232,195,90,.14)}
.checks li{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.st{flex:none;min-width:72px;text-align:center;font-size:12.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 10px;margin-top:2px}
.st.applies{background:var(--free-bg);color:var(--free-ink)}
.st.review{background:#F6E7B8;color:#5C4408}
.cn b{display:block;font-weight:700;font-size:16px;color:var(--navy);line-height:1.3}
.cn small{display:block;font-size:14.5px;color:var(--muted);line-height:1.4}
.sample-note{margin-top:28px;color:#CBD2E2;font-size:16px}

/* 5 tool and learning */
.tool-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(32px,5vw,80px);align-items:start}
.flow{display:flex;flex-wrap:wrap;gap:0;background:var(--navy);border-radius:999px;padding:6px;counter-reset:s}
.flow li{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;color:var(--cream);font-weight:600;font-size:15.5px;white-space:nowrap;position:relative}
.flow li span{width:24px;height:24px;border-radius:50%;background:var(--gold2);color:var(--navy);display:grid;place-items:center;font-size:13px;font-weight:700}
.flownote{color:var(--muted);font-size:16px;margin:14px 4px 0}
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:28px 32px;margin-top:40px}
.feats h3{font-size:22px;margin-bottom:6px}
.feats p{color:var(--muted);font-size:17px}
.signin-line{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:40px;color:var(--muted)}
.learn{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:clamp(26px,3vw,40px)}
.learn-t{font-size:clamp(26px,2.8vw,32px)}
.learn-l{color:var(--muted);margin:10px 0 26px;font-size:17px}
.ladder{position:relative;display:flex;flex-direction:column;gap:14px}
.ladder li{display:flex;gap:16px;align-items:flex-start;background:var(--paper);border-radius:14px;padding:14px 16px;margin-left:calc(var(--i)*clamp(0px,1.6vw,18px))}
.lvn{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold2);display:grid;place-items:center;font-family:var(--serif);font-size:17px}
.ladder h3{font-size:20px;font-family:var(--serif)}
.ladder p{color:var(--muted);font-size:16px;margin-top:2px;line-height:1.5}
.learn .flownote{margin:20px 2px 0}

/* 6 trust */
.trust-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);align-items:start}
.trust-items{display:grid;grid-template-columns:1fr;gap:0}
.trust-items li{padding:22px 0 22px 28px;border-top:1px solid var(--line);position:relative}
.trust-items li:last-child{border-bottom:1px solid var(--line)}
.trust-items li::before{content:"";position:absolute;left:0;top:34px;width:12px;height:12px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 4px rgba(232,195,90,.25)}
.trust-items h3{font-size:24px}
.trust-items p{color:var(--muted);margin-top:6px;font-size:17.5px}
.person{background:var(--navy);color:var(--cream);border-radius:24px;padding:clamp(28px,3.4vw,44px);position:relative;overflow:hidden}
.person::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(232,195,90,.2),transparent 70%)}
.person .kick{color:var(--gold2)}
.pn{display:flex;align-items:center;gap:16px;margin:16px 0 22px}
.mono{width:56px;height:56px;border-radius:50%;background:linear-gradient(180deg,#F2D77F,var(--gold2));color:var(--navy);display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:600}
.pn b{display:block;font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.1}
.pn span:not(.mono){display:block;color:#CBD2E2;font-size:15.5px}
.person blockquote p{font-family:var(--serif);font-style:italic;font-size:clamp(21px,2.2vw,25px);line-height:1.35}
.person .bg{color:#D5DAE8;font-size:16.5px;margin:20px 0 22px;padding-top:20px;border-top:1px solid rgba(255,255,255,.16)}
.person .more{color:var(--gold2);text-decoration-color:rgba(232,195,90,.5);font-size:15.5px}

/* 7 insights */
.posts{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2vw,24px)}
.posts a{display:flex;flex-direction:column;gap:8px;height:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;text-decoration:none;transition:border-color .3s,transform .3s var(--ease),box-shadow .3s}
.posts a:hover{border-color:#C9BDA4;transform:translateY(-3px);box-shadow:0 22px 44px -28px rgba(12,20,40,.4)}
.posts b{font-family:var(--serif);font-weight:500;font-size:clamp(21px,2.1vw,25px);line-height:1.2;color:var(--navy)}
.posts small{font-size:16px;color:var(--muted);line-height:1.5}
.posts .more{margin-top:auto;padding-top:6px;text-decoration:none}
.series{margin-top:clamp(28px,4vw,44px)}
.series li{border-top:1px solid var(--line)}
.series li:last-child{border-bottom:1px solid var(--line)}
.series a{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 4px;text-decoration:none;transition:padding .3s var(--ease),background .3s}
.series a:hover{padding-left:14px;background:rgba(255,252,246,.6)}
.series b{font-family:var(--serif);font-weight:500;font-size:clamp(21px,2.2vw,26px);color:var(--navy);display:block}
.series small{font-size:16px;color:var(--muted);display:block}
.all{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin-top:36px;color:var(--muted)}

/* 8 contact */
.contact{background:var(--navy);margin-top:clamp(72px,10vw,136px);padding:clamp(72px,10vw,128px) 0;color:var(--cream);position:relative;overflow:hidden}
.contact::before{content:"";position:absolute;right:-12%;top:-30%;width:60%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(232,195,90,.14),transparent 65%);pointer-events:none}
.contact-in{max-width:46rem;position:relative}
.contact h2{font-size:clamp(40px,6.4vw,72px);margin:18px 0 0;line-height:1.04}
.contact .sub{font-size:clamp(18px,1.9vw,21px);max-width:34em}
.sign{font-family:var(--serif);font-style:italic;font-size:21px;margin-top:18px;color:var(--gold2)}
.mail{color:var(--cream);font-size:18px;text-underline-offset:5px;text-decoration-color:rgba(232,195,90,.6)}
.contact .price-note{color:#CBD2E2;margin:22px 0 0}

/* footer */
.foot-site{background:var(--paper2);padding:44px 0 56px;font-size:15.5px;color:var(--muted)}
.foot-site .wrap{display:grid;gap:12px}
.legal-links{display:flex;flex-wrap:wrap;gap:6px 24px}
.legal-links a{color:var(--navy);text-underline-offset:4px}
.legal-links small{color:var(--muted)}
.copy{margin-top:6px;color:var(--navy);font-weight:600}

/* responsive */
@media(max-width:1020px){
  .hero{grid-template-columns:1fr}
  .journey-grid,.tool-grid,.trust-grid{grid-template-columns:1fr}
  .journey-intro{position:static}
  .sheets{grid-template-columns:1fr 1fr}
  .sheet.check{grid-column:1/-1}
}
@media(max-width:920px){
  .signin-d{display:none}
  .menu-toggle{display:inline-flex;align-items:center;position:relative;z-index:52}
  .top{gap:12px;background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none}
  .top-actions{margin-left:auto;gap:10px}
  .top .logo,.top-actions .pill{position:relative;z-index:52}
  #site-menu{display:none;position:fixed;inset:0;background:var(--paper);flex-direction:column;align-items:stretch;justify-content:center;padding:96px 28px 36px;gap:2px;z-index:50;margin:0}
  #site-menu.open{display:flex}
  #site-menu a{font-size:30px;font-family:var(--serif);color:var(--navy);padding:11px 0;min-height:48px;border-bottom:1px solid var(--line)}
  #site-menu a::after{display:none}
  .signin-m{display:block;margin-top:14px;color:var(--gold)!important;font-weight:600}
  body.menu-open{overflow:hidden}
  .people{grid-template-columns:1fr}
  .entities{grid-template-columns:1fr}
  .entities h3{grid-row:auto}
  .posts{grid-template-columns:1fr}
}
@media(max-width:640px){
  body{font-size:17px}
  .sheets{grid-template-columns:1fr}
  .feats{grid-template-columns:1fr;gap:24px}
  .step{grid-template-columns:40px minmax(0,1fr);gap:0 14px}
  .node{width:40px;height:40px;font-size:18px;box-shadow:0 0 0 5px var(--paper)}
  .step::before{left:19px;top:40px}
  .step-body{padding:18px 18px 20px}
  .cta .pill{flex:1 1 100%}
  .flow{border-radius:22px;padding:8px}
  .flow li{flex:1 1 45%;justify-content:flex-start}
  .ladder li{margin-left:0}
  .secnum{display:none}
  .pill.sm{padding:9px 16px}
  .logo span{font-size:11px;letter-spacing:.13em}
  .hero h1{font-size:clamp(40px,12.4vw,52px)}
  .sheet figcaption{padding-right:0;padding-top:34px}
}
@media(max-width:380px){.logo span{display:none}}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition:none!important;animation:none!important}
  .js .rv,.js .hi{opacity:1;transform:none}
  .step::before{transform:scaleY(1)}
}
</style>
