<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rewards World™ | Pay you can cost, explain and defend</title>
<meta name="description" content="Rewards World™ is a focused total rewards firm for Indian boards, CHROs, CFOs and founders, with a working tool behind every piece of work. Design it. Cost it. Govern it.">
<meta name="theme-color" content="#0C1428">
<link rel="icon" href="logo.png">
<link rel="preload" href="fonts/Newsreader-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/SourceSans3-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<script>document.documentElement.className+=" js"</script>
<style>
@font-face{font-family:"Newsreader";font-style:italic;font-weight:400 500;font-display:swap;src:url(fonts/Newsreader-italic-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:"Newsreader";font-style:italic;font-weight:400 500;font-display:swap;src:url(fonts/Newsreader-italic-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/Newsreader-normal-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:"Newsreader";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/Newsreader-normal-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
@font-face{font-family:"Source Sans 3";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/SourceSans3-normal-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:"Source Sans 3";font-style:normal;font-weight:400 700;font-display:swap;src:url(fonts/SourceSans3-normal-latin.woff2) format("woff2");unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}

:root{
  --paper:#F6F3EC; --paper2:#EDE8DE; --card:#FFFcf8; --ink:#1A1C1F; --muted:#3C4350; --line:#D4CDBF;
  --navy:#0E1628; --navy2:#162238; --gold:#5C4A12; --goldline:#C4A24A; --cream:#F6F3EC;
  --free-bg:#E3EFE7; --free-ink:#145C32; --focus:#5C4A12;
  --serif:Newsreader,Georgia,"Times New Roman",serif; --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);font-size:18px;line-height:1.65;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;overflow-x:hidden}
section[id],[id^="svc-"]{scroll-margin-top:88px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.02em;color:var(--navy);line-height:1.12;margin:0}
h1,h2{text-wrap:balance}
p{margin:0}
a{color:inherit}
img{display:block;max-width:100%}
ul,ol{list-style:none;margin:0;padding:0}
blockquote{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:2px}
.contact :focus-visible{outline-color:var(--goldline)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:0;transform:translateY(-200%);z-index:60;background:var(--navy);color:#fff;padding:10px 16px;text-decoration:none}
.skip:focus{transform:translateY(12px)}
.wrap{max-width:1160px;margin:0 auto;padding:0 clamp(22px,4.4vw,40px)}
.arr{display:inline-block;vertical-align:-2px;margin-left:2px;transition:transform .25s var(--ease)}
a:hover>.arr,a:focus-visible>.arr,.pill:hover .arr{transform:translateX(3px)}

/* header */
.bar{height:2px;background:var(--navy)}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;padding:14px clamp(18px,4vw,48px);background:rgba(246,243,236,.94);-webkit-backdrop-filter:saturate(1.2) blur(10px);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:11px;text-decoration:none;font-weight:700;font-size:11px;letter-spacing:.18em;color:var(--navy);flex-shrink:0}
.logo img{border-radius:4px}
#site-menu{display:flex;align-items:center;gap:2px 28px;margin-left:auto}
#site-menu a{text-decoration:none;font-size:15px;color:var(--muted);padding:8px 0;position:relative}
#site-menu a:hover{color:var(--navy)}
.signin-m{display:none}
.top-actions{display:flex;align-items:center;gap:18px}
.signin-d{text-decoration:none;font-weight:600;font-size:15px;color:var(--navy);padding:8px 2px}
.signin-d:hover{text-decoration:underline;text-underline-offset:4px}
.menu-toggle{display:none;appearance:none;background:none;border:1px solid var(--navy);color:var(--navy);border-radius:0;padding:0 16px;min-height:44px;font:600 15px/1 var(--sans);cursor:pointer}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:0;padding:13px 26px;font-weight:600;text-decoration:none;font-size:16px;text-align:center;border:1px solid transparent;min-height:48px;letter-spacing:.01em;transition:background .2s,color .2s,border-color .2s}
.pill.sm{padding:8px 16px;min-height:40px;font-size:15px}
.pill.solid{background:var(--navy);color:var(--cream)}
.pill.solid:hover{background:#1A2742}
.pill.solid.light{background:var(--cream);color:var(--navy)}
.pill.solid.light:hover{background:#fff}
.pill.ghost{border-color:var(--navy);color:var(--navy);background:transparent}
.pill.ghost:hover{background:var(--navy);color:var(--cream)}

/* sections */
.block{padding:clamp(80px,11vw,148px) 0 0}
.eyebrow{color:var(--gold);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px}
.contact .eyebrow{color:var(--goldline)}
.sec-head{max-width:40rem;margin-bottom:clamp(40px,5.5vw,72px)}
.sec-head h2{font-size:clamp(32px,4.2vw,48px);margin:14px 0 0;letter-spacing:-.025em}
.sub{color:var(--muted);font-size:clamp(17px,1.5vw,19px);margin-top:18px;max-width:38em}
.contact h2{color:var(--cream)}
.contact .sub{color:#C9D0DE}
.more{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:15px;color:var(--navy);text-decoration:underline;text-decoration-color:rgba(92,74,18,.45);text-underline-offset:5px;text-decoration-thickness:1px}
.more:hover{text-decoration-color:var(--gold)}
.kick{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}

/* motion */
.js .rv{opacity:0;transform:translateY(12px);transition:opacity .7s var(--ease) var(--d,0ms),transform .7s var(--ease) var(--d,0ms)}
.js .rv.in{opacity:1;transform:none}
.js .hi{opacity:0;transform:translateY(12px);animation:rise .85s var(--ease) var(--d,0ms) forwards}
@keyframes rise{to{opacity:1;transform:none}}

/* 1 hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.78fr);gap:clamp(36px,7vw,96px);align-items:end;padding-top:clamp(56px,9vw,128px);padding-bottom:0}
.hero h1{font-size:clamp(40px,6.8vw,76px);letter-spacing:-.03em;line-height:1.02;margin:18px 0 24px;max-width:11em}
.lead{font-size:clamp(18px,1.7vw,20px);color:var(--muted);max-width:34em}
.root{font-family:var(--serif);font-style:italic;font-size:clamp(20px,2vw,24px);color:var(--navy);margin-top:22px;line-height:1.35}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:36px}
.questions{border-top:1px solid var(--navy);padding:28px 0 0}
.qt{font-size:12px;font-family:var(--sans);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.questions ol li{display:flex;gap:16px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:clamp(20px,2vw,23px);line-height:1.3;color:var(--navy)}
.qn{font-size:13px;font-family:var(--sans);font-weight:700;color:var(--gold);min-width:1.1em}
.qnote{color:var(--muted);font-size:16px;margin:18px 0 20px}
.tests{display:flex;flex-wrap:wrap;gap:8px 0;border-top:1px solid var(--line);padding-top:16px}
.tests li{font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);white-space:nowrap}
.tests li:not(:last-child)::after{content:"·";margin:0 12px;color:#8A8376;font-weight:500;letter-spacing:0}
.tagline{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--navy);margin-top:20px}

/* 2 journey */
.journey-grid{display:grid;grid-template-columns:minmax(0,.78fr) minmax(0,1.22fr);gap:clamp(36px,6vw,96px);align-items:start}
.journey-intro{position:sticky;top:110px}
.journey-intro .sec-head{margin-bottom:28px}
.price-note{color:var(--muted);font-size:16px;margin:0 0 22px;max-width:28em}
.steps{position:relative}
.step{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 22px;padding-bottom:32px}
.step::before{content:"";position:absolute;left:21px;top:44px;bottom:-2px;width:1px;background:var(--line);transform:scaleY(0);transform-origin:top;transition:transform 1s var(--ease) .15s}
.js .step.in::before,.step.in::before{transform:scaleY(1)}
.step.last::before{display:none}
.step.last{padding-bottom:0}
.node{width:44px;height:44px;border-radius:50%;border:1px solid var(--navy);background:var(--paper);color:var(--navy);display:grid;place-items:center;font-family:var(--serif);font-size:18px}
.step-body{border-top:1px solid var(--navy);padding:18px 0 6px}
.step-body:hover{border-top-color:var(--goldline)}
.step-main h3{font-size:clamp(22px,2.2vw,26px)}
.step-main p{color:var(--muted);margin-top:6px;font-size:17px}
.step-side{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;margin-top:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 0}
.tag.free{color:var(--free-ink)}
.tag.soft{color:var(--gold)}
.feeds{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-family:var(--serif);font-style:italic;font-size:18px;color:var(--muted);line-height:1.4}
.feeds .fl{font-family:var(--sans);font-style:normal;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:4px}

/* 3 who */
.people{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--navy);align-items:stretch}
.people article{padding:clamp(28px,3.2vw,40px) clamp(24px,3vw,40px) clamp(28px,3.2vw,40px) 0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.people article:nth-child(2n){padding-right:0;padding-left:clamp(24px,3vw,40px);border-right:0}
.people h3{font-size:clamp(24px,2.4vw,30px)}
.people blockquote p{font-family:var(--serif);font-style:italic;font-size:clamp(19px,1.8vw,22px);line-height:1.4;color:var(--navy)}
.people blockquote p::before{content:"“"}
.people blockquote p::after{content:"”"}
.gives{color:var(--muted);font-size:17px}
.people article:nth-last-child(-n+2){border-bottom:0}
.people .more{margin-top:auto}
.entities{margin-top:clamp(40px,5vw,64px);padding-top:clamp(28px,3vw,40px);border-top:1px solid var(--navy)}
.entities h3{font-size:clamp(22px,2.2vw,26px);margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chips li{border:1px solid var(--navy);color:var(--navy);padding:7px 16px;font-weight:600;font-size:15px}
.entities p{color:var(--muted);font-size:16px;max-width:46em}

/* 4 outputs */
.outputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 clamp(28px,4vw,56px);border-top:1px solid var(--navy)}
.outputs article{padding:28px 0 8px}
.outputs h3{font-size:clamp(24px,2.4vw,30px);margin-bottom:12px}
.outputs p{color:var(--muted);font-size:17px;max-width:28em}

/* 5 tool and learning */
.tool-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:clamp(36px,5vw,80px);align-items:start}
.flow{display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--navy);border-bottom:1px solid var(--navy);padding:4px 0}
.flow li{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 10px;color:var(--navy);font-weight:600;font-size:15px;white-space:nowrap}
.flow li span{font-family:var(--serif);font-weight:500;font-size:18px;color:var(--gold);min-width:1em}
.flownote{color:var(--muted);font-size:16px;margin:14px 0 0}
.feats{display:grid;grid-template-columns:repeat(2,1fr);gap:32px 40px;margin-top:44px}
.feats h3{font-size:22px;margin-bottom:6px}
.feats p{color:var(--muted);font-size:17px}
.signin-line{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:40px;color:var(--muted)}
.learn{border-top:1px solid var(--navy);padding-top:28px}
.learn-t{font-size:clamp(26px,2.6vw,32px)}
.learn-l{color:var(--muted);margin:10px 0 28px;font-size:17px}
.ladder{display:flex;flex-direction:column}
.ladder li{display:flex;gap:16px;align-items:flex-start;padding:16px 0;border-top:1px solid var(--line)}
.ladder li:last-child{border-bottom:1px solid var(--line)}
.lvn{flex:none;width:1.4em;font-family:var(--serif);font-size:18px;color:var(--gold);padding-top:1px}
.ladder h3{font-size:20px}
.ladder p{color:var(--muted);font-size:16px;margin-top:2px;line-height:1.5}
.learn .flownote{margin:18px 0 0}

/* 6 trust */
.trust-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(32px,5vw,80px);align-items:start}
.trust-items li{padding:22px 0;border-top:1px solid var(--line)}
.trust-items li:first-child{border-top:1px solid var(--navy)}
.trust-items li:last-child{border-bottom:1px solid var(--line)}
.trust-items h3{font-size:24px}
.trust-items p{color:var(--muted);margin-top:6px;font-size:17px}
.person{border-top:1px solid var(--navy);padding-top:28px}
.pn{margin:14px 0 18px}
.pn b{display:block;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1;color:var(--navy)}
.pn span{display:block;color:var(--muted);font-size:16px;margin-top:4px}
.person .bg{color:var(--muted);font-size:17px;max-width:34em}

/* 7 insights */
.posts{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border-top:1px solid var(--navy);align-items:stretch}
.posts li{display:flex;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.posts li:nth-child(2n){border-right:0}
.posts a{display:flex;flex-direction:column;gap:8px;flex:1;padding:28px 32px 28px 0;text-decoration:none}
.posts li:nth-child(2n) a{padding-left:32px;padding-right:0}
.posts a:hover b{text-decoration:underline;text-underline-offset:4px}
.posts b{font-family:var(--serif);font-weight:500;font-size:clamp(20px,2vw,24px);line-height:1.22;color:var(--navy)}
.posts small{font-size:16px;color:var(--muted);line-height:1.5}
.posts .more{margin-top:auto;padding-top:10px;text-decoration:none}
.series{margin-top:clamp(8px,2vw,16px)}
.series li{border-bottom:1px solid var(--line)}
.series li:first-child{border-top:1px solid var(--navy)}
.series a{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 0;text-decoration:none}
.series a:hover b{text-decoration:underline;text-underline-offset:4px}
.series b{font-family:var(--serif);font-weight:500;font-size:clamp(20px,2.1vw,24px);color:var(--navy);display:block}
.series small{font-size:16px;color:var(--muted);display:block;margin-top:3px}
.all{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin-top:36px;color:var(--muted)}

/* 8 contact */
.contact{background:var(--navy);margin-top:clamp(80px,11vw,148px);padding:clamp(80px,11vw,128px) 0;color:var(--cream)}
.contact-in{max-width:40rem}
.contact h2{font-size:clamp(40px,6vw,68px);margin:16px 0 0;line-height:1.02;letter-spacing:-.03em}
.contact .sub{font-size:clamp(18px,1.8vw,20px);max-width:34em}
.sign{font-family:var(--serif);font-style:italic;font-size:20px;margin-top:20px;color:var(--goldline)}
.mail{color:var(--cream);font-size:17px;text-underline-offset:5px;text-decoration-color:rgba(196,162,74,.7)}
.contact .price-note{color:#C9D0DE;margin:22px 0 0}
.contact .cta{margin-top:32px}

/* footer */
.foot-site{background:var(--paper);padding:48px 0 64px;font-size:15px;color:var(--muted);border-top:1px solid var(--line)}
.foot-site .wrap{display:grid;gap:12px}
.place{font-family:var(--serif);font-style:italic;font-size:20px;color:var(--navy);margin-bottom:8px}
.legal-links{display:flex;flex-wrap:wrap;gap:6px 24px}
.legal-links a{color:var(--navy);text-underline-offset:4px}
.legal-links small{color:var(--muted)}
.copy{margin-top:8px;color:var(--navy);font-weight:600;letter-spacing:.04em;font-size:13px}

/* responsive */
@media(max-width:1020px){
  .hero{grid-template-columns:1fr;align-items:start}
  .journey-grid,.tool-grid,.trust-grid{grid-template-columns:1fr}
  .journey-intro{position:static}
  .outputs{grid-template-columns:1fr;gap:0}
  .outputs article{padding:24px 0;border-bottom:1px solid var(--line)}
  .outputs article:last-child{border-bottom:0}
}
@media(max-width:920px){
  .signin-d{display:none}
  .menu-toggle{display:inline-flex;align-items:center;position:relative;z-index:52}
  .top{gap:12px;background:var(--paper);-webkit-backdrop-filter:none;backdrop-filter:none}
  .top-actions{margin-left:auto;gap:10px}
  .top .logo,.top-actions .pill{position:relative;z-index:52}
  #site-menu{display:none;position:fixed;inset:0;background:var(--paper);flex-direction:column;align-items:stretch;justify-content:center;padding:96px 28px 36px;gap:2px;z-index:50;margin:0}
  #site-menu.open{display:flex}
  #site-menu a{font-size:30px;font-family:var(--serif);color:var(--navy);padding:11px 0;min-height:48px;border-bottom:1px solid var(--line)}
  .signin-m{display:block;margin-top:14px;color:var(--gold)!important;font-weight:600}
  body.menu-open{overflow:hidden}
  .people{grid-template-columns:1fr}
  .people article,.people article:nth-child(2n){padding:28px 0;border-right:0}
  .people article:nth-last-child(-n+2){border-bottom:1px solid var(--line)}
  .people article:last-child{border-bottom:0}
  .posts{grid-template-columns:1fr}
  .posts li{border-right:0}
  .posts a,.posts li:nth-child(2n) a{padding:24px 0}
}
@media(max-width:640px){
  body{font-size:17px}
