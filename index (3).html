<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rewards World</title>
  <meta name="description" content="Launching soon. Specialized advisory, frameworks, and insights for enterprise.">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: #f7f4ee;
      color: #1c1915;
    }
    main { width: min(720px, calc(100% - 40px)); padding: 64px 0; }
    .mark { letter-spacing: 0.18em; font-size: 12px; font-family: Arial, sans-serif; }
    h1 { font-size: clamp(32px, 5vw, 52px); line-height: 1.15; font-weight: 500; margin: 18px 0; }
    p { font-size: 18px; line-height: 1.6; max-width: 38em; }
    a.button {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 18px;
      background: #1c1915;
      color: #fff;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
    }
    .tags, footer { font-family: Arial, sans-serif; font-size: 12px; letter-spacing: 0.08em; color: #5c564e; }
    footer { margin-top: 48px; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <div class="mark">REWARDS WORLD™ · LAUNCHING SOON</div>
    <p>Launching soon. Specialized advisory, frameworks, and insights for enterprise.</p>
    <a class="button" href="https://rewardsworld.substack.com/">READ ON SUBSTACK</a>
    <p class="tags">TOTAL REWARDS · EXECUTIVE COMPENSATION · PAY GOVERNANCE</p>
    <footer>
      © 2026 Rewards World. All rights reserved.<br>
      <a href="mailto:totalrewardsworld@gmail.com">totalrewardsworld@gmail.com</a>
    </footer>
  </main>
</body>
</html>
